<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>김재원 마이너 갤러리</title> 
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--blue:#293e75;--line:#d9dfe8;--muted:#777;--bg:#f5f6f8}
*{box-sizing:border-box}body{margin:0;background:#fff;color:#222;font:13px Arial,"Malgun Gothic",sans-serif}
a{color:inherit;text-decoration:none}button,input,textarea,select{font:inherit}
.top{height:62px;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 max(18px,calc((100% - 1100px)/2));gap:20px}
.logo{font-size:25px;font-weight:900;letter-spacing:-1.5px;color:#293e75}.logo span{color:#555}
.topsearch{display:flex;max-width:420px;flex:1}.topsearch input{width:100%;height:34px;border:1px solid #cbd1db;padding:0 10px}.topsearch button{border:0;background:#293e75;color:#fff;padding:0 15px}
.topright{margin-left:auto;color:#666;font-size:12px}
.wrap{max-width:1100px;margin:24px auto;padding:0 18px}.crumb{font-size:12px;color:#777;margin-bottom:14px}
.head{border-bottom:2px solid #293e75;padding:0 0 13px;display:flex;align-items:end;gap:12px}
.head h1{font-size:24px;margin:0;color:#222;letter-spacing:-1px}.sub{color:#888;font-size:12px}
.tabs{display:flex;gap:0;border-bottom:1px solid #ccd2dc;margin-top:16px}
.tabs button{background:#fff;border:1px solid transparent;padding:10px 18px;color:#555;cursor:pointer}
.tabs button.active{border:1px solid #ccd2dc;border-bottom:1px solid white;color:#293e75;font-weight:bold;margin-bottom:-1px}
.toolbar{display:flex;align-items:center;gap:7px;margin:16px 0 10px}.toolbar .count{color:#666}.spacer{flex:1}
.btn{border:1px solid #c8ced8;background:#fff;padding:7px 12px;cursor:pointer;border-radius:2px;color:#333}.btn.primary{background:#293e75;color:#fff;border-color:#293e75}.btn:hover{filter:brightness(.96)}
table{width:100%;border-collapse:collapse;table-layout:fixed}th{background:#f7f8fa;border-top:1px solid #aeb7c6;border-bottom:1px solid #d7dce4;padding:10px 5px;color:#555;font-weight:normal}
td{border-bottom:1px solid #e7e9ed;padding:10px 5px;text-align:center;color:#777}
td.subject{text-align:left;color:#222;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subject a:hover{text-decoration:underline;color:#293e75}.num{width:7%}.writer{width:13%}.date{width:12%}.views{width:8%}.likes{width:8%}
.notice{background:#fbfbfd}.notice .tag{color:#293e75;font-weight:bold}
.pagination{display:flex;justify-content:center;gap:5px;margin:22px}.pagination button{border:1px solid #ddd;background:#fff;padding:5px 9px;cursor:pointer}.pagination button.active{color:#293e75;font-weight:bold;border-color:#293e75}
.searchbar{display:flex;justify-content:center;gap:5px;margin:18px}.searchbar select,.searchbar input{height:32px;border:1px solid #cbd1db;padding:0 8px}.searchbar input{width:230px}
.post{border-top:2px solid #293e75}.posthead{padding:18px 12px;border-bottom:1px solid #ddd}.posthead h2{font-size:20px;margin:0 0 12px}.meta{color:#888;font-size:12px;display:flex;gap:15px}.postbody{min-height:240px;padding:28px 16px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}.postbody img{max-width:100%;height:auto;display:block;margin:12px 0}
.postactions{border-top:1px solid #eee;border-bottom:1px solid #eee;padding:14px;display:flex;justify-content:center;gap:8px}
.comments{margin-top:24px}.comments h3{font-size:15px;border-bottom:1px solid #ddd;padding-bottom:10px}.comment{padding:12px 5px;border-bottom:1px solid #eee}.comment b{margin-right:8px}.comment small{color:#999;margin-left:8px}.comment p{margin:8px 0 0;white-space:pre-wrap}
.commentform{display:flex;gap:6px;margin-top:12px}.commentform input{flex:1;border:1px solid #ccc;padding:9px}
.editor{border:1px solid #cfd5df;padding:15px;margin-top:15px;background:#fafbfc}.editor h3{margin:0 0 12px}.field{margin:10px 0}.field label{display:block;color:#555;margin-bottom:5px}.field input,.field textarea{width:100%;border:1px solid #cbd1db;padding:9px;background:white}.field textarea{min-height:230px;resize:vertical}
.modalback{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modal{background:white;width:min(390px,100%);padding:22px;border-radius:4px;box-shadow:0 8px 35px #0003}.modal h3{margin:0 0 15px}.modal input{width:100%;padding:10px;border:1px solid #cbd1db}.modalfoot{display:flex;justify-content:flex-end;gap:7px;margin-top:14px}
.footer{border-top:1px solid #eee;margin-top:50px;padding:22px 0;color:#aaa;font-size:11px;text-align:center}
.empty{text-align:center;padding:55px 10px;color:#888}
.adminbadge{font-size:11px;color:#fff;background:#b33;padding:3px 6px;border-radius:2px}
.hidden{display:none!important}
@media(max-width:650px){.top{gap:10px;padding:0 12px}.logo{font-size:21px}.topright{font-size:0}.wrap{padding:0 10px;margin-top:18px}.head h1{font-size:20px}th,td{font-size:11px;padding:9px 2px}.writer{width:17%}.date{width:16%}.views,.likes{width:9%}.num{width:8%}.toolbar{flex-wrap:wrap}.posthead h2{font-size:18px}}
</style>
</head>
<body>
<header class="top"><a class="logo" href="#" onclick="goList();return false">DC<span>INSIDE</span></a><form class="topsearch" id="topSearch"><input id="globalQuery" placeholder="갤러리 내 검색"><button>검색</button></form><div class="topright"><button class="btn" id="adminLoginBtn">관리자 로그인</button><button class="btn hidden" id="adminLogoutBtn">로그아웃</button></div></header>
<main class="wrap">
<div class="crumb">디시인사이드 &gt; 마이너 갤러리 &gt; <span id="crumbName">갤러리</span></div>
<section class="head"><div><h1 id="galleryName">마이너 갤러리</h1><div class="sub" id="galleryDesc">자유롭게 이야기를 나누는 공간입니다.</div></div><div class="spacer"></div><span id="adminBadge" class="adminbadge hidden">ADMIN</span></section>
<nav class="tabs"><button class="active" data-tab="all">전체글</button><button data-tab="notice">공지</button><button data-tab="best">개념글</button></nav>
<section id="listView">
<div class="toolbar"><span class="count" id="postCount">전체글 0</span><div class="spacer"></div><button class="btn" id="galleryEditBtn">갤러리 설정</button><button class="btn primary" id="writeBtn">글쓰기</button></div>
<table><thead><tr><th class="num">번호</th><th>제목</th><th class="writer">글쓴이</th><th class="date">작성일</th><th class="views">조회</th><th class="likes">추천</th></tr></thead><tbody id="postRows"></tbody></table>
<div class="pagination" id="pagination"></div>
<div class="searchbar"><select id="searchType"><option value="all">제목+내용</option><option value="title">제목</option><option value="body">내용</option><option value="writer">글쓴이</option></select><input id="searchQuery" placeholder="검색어를 입력하세요"><button class="btn" id="searchBtn">검색</button></div>
</section>
<section id="detailView" class="hidden"></section>
<div class="footer">DCINSIDE STYLE GALLERY · 본 사이트는 개인 제작 커뮤니티입니다.</div>
</main>
<div class="modalback" id="loginModal"><div class="modal"><h3>관리자 인증</h3><p style="color:#777;font-size:12px">관리자 비밀번호를 입력하세요.</p><input id="passwordInput" type="password" placeholder="비밀번호" autocomplete="current-password"><div class="modalfoot"><button class="btn" id="cancelLogin">취소</button><button class="btn primary" id="confirmLogin">확인</button></div><p id="loginError" style="color:#b33;font-size:12px"></p></div></div>
<script>
const SUPABASE_URL = "https://mqxgdlcotatamhidwgvi.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_D9LlZ8qh4d46fVlcbYGZFg_bxx8osVB";
const sbReady = SUPABASE_URL.startsWith("https://") && !SUPABASE_URL.includes("YOUR_") && !SUPABASE_ANON_KEY.includes("YOUR_");
const sb = sbReady ? window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY) : null;
let posts=[], settings={name:"마이너 갤러리",description:"자유롭게 이야기를 나누는 공간입니다."};
let isAdmin=false, currentTab="all", currentPage=1, currentPost=null, searchState={q:"",type:"all"};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function dateShort(s){if(!s)return "";let d=new Date(s);return `${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`;}
function toast(s){alert(s)}
async function publicApi(action,data={}){if(!sb)throw Error("먼저 Supabase URL과 anon key를 설정해 주세요.");let {data:r,error}=await sb.functions.invoke("admin-api",{body:{action,...data}});if(error)throw error;if(r?.error)throw Error(r.error);return r;}
async function loadAll(){
 if(!sb){render();return;}
 try{
  const [{data:p,error:pe},{data:s,error:se}] = await Promise.all([sb.from("posts").select("*").order("created_at",{ascending:false}),sb.from("gallery_settings").select("*").eq("id",1).maybeSingle()]);
  if(pe)throw pe;if(se)throw se;posts=p||[];if(s)settings={name:s.name,description:s.description};
 }catch(e){console.error(e);toast("데이터를 불러오지 못했습니다: "+e.message)}
 render();
}
function render(){
 $("galleryName").textContent=settings.name;$("crumbName").textContent=settings.name;$("galleryDesc").textContent=settings.description;
 $("adminBadge").classList.toggle("hidden",!isAdmin);
 if(currentPost){renderDetail();return;}
 $("listView").classList.remove("hidden");$("detailView").classList.add("hidden");
 let filtered=posts.filter(p=>{
  if(currentTab==="notice"&&!p.is_notice)return false;
  if(currentTab==="best"&&!p.is_best)return false;
  let q=searchState.q.toLowerCase();if(!q)return true;
  let vals=searchState.type==="title"?[p.title]:searchState.type==="body"?[p.body]:searchState.type==="writer"?[p.writer]:[p.title,p.body,p.writer];
  return vals.some(v=>String(v||"").toLowerCase().includes(q));
 });
 $("postCount").textContent="전체글 "+filtered.length;
 let pages=Math.max(1,Math.ceil(filtered.length/20));currentPage=Math.min(currentPage,pages);
 let slice=filtered.slice((currentPage-1)*20,currentPage*20);
 $("postRows").innerHTML=slice.length?slice.map((p,i)=>`<tr class="${p.is_notice?'notice':''}"><td>${p.is_notice?'<span class="tag">공지</span>':filtered.length-(currentPage-1)*20-i}</td><td class="subject"><a href="#" onclick="openPost('${p.id}');return false">${esc(p.title)} <span style="color:#999">[${p.comment_count||0}]</span></a></td><td>${esc(p.writer||"익명")}</td><td>${dateShort(p.created_at)}</td><td>${p.views||0}</td><td>${p.likes||0}</td></tr>`).join(""):`<tr><td colspan="6" class="empty">등록된 게시글이 없습니다.</td></tr>`;
 $("pagination").innerHTML=Array.from({length:pages},(_,i)=>`<button class="${i+1===currentPage?'active':''}" onclick="currentPage=${i+1};render()">${i+1}</button>`).join("");
 $("galleryEditBtn").classList.toggle("hidden",!isAdmin);$("writeBtn").classList.toggle("hidden",!isAdmin);
}
async function openPost(id){currentPost=posts.find(p=>p.id===id);if(!currentPost)return;currentPost.views=(currentPost.views||0)+1;if(sb)publicApi("view_post",{id}).catch(()=>{});renderDetail();}
function renderDetail(){
 $("listView").classList.add("hidden");$("detailView").classList.remove("hidden");let p=currentPost;
 $("detailView").innerHTML=`<div class="toolbar"><button class="btn" onclick="goList()">목록</button><div class="spacer"></div>${isAdmin?`<button class="btn" onclick="editPost('${p.id}')">수정</button><button class="btn" onclick="deletePost('${p.id}')">삭제</button>`:""}</div>
 <article class="post"><div class="posthead"><h2>${esc(p.title)}</h2><div class="meta"><span>${esc(p.writer||"익명")}</span><span>${new Date(p.created_at).toLocaleString("ko-KR")}</span><span>조회 ${p.views||0}</span><span>추천 ${p.likes||0}</span></div></div><div class="postbody">${esc(p.body||"")}</div><div class="postactions"><button class="btn" onclick="likePost('${p.id}')">추천 ${p.likes||0}</button></div></article>
 <section class="comments"><h3>댓글 <span id="commentCount">0</span></h3><div id="commentList">불러오는 중...</div><div id="commentAdmin" class="${isAdmin?"":"hidden"}"><div class="commentform"><input id="commentWriter" placeholder="작성자" value="관리자"><input id="commentBody" placeholder="댓글 내용"><button class="btn primary" onclick="saveComment()">등록</button></div></div></section>`;
 loadComments(p.id);
}
async function loadComments(id){if(!sb){$("commentList").textContent="댓글을 보려면 Supabase 설정이 필요합니다.";return;}let {data,error}=await sb.from("comments").select("*").eq("post_id",id).order("created_at");if(error){$("commentList").textContent="댓글을 불러오지 못했습니다.";return;}$("commentCount").textContent=data.length;$("commentList").innerHTML=(data.length?data.map(c=>`<div class="comment"><b>${esc(c.writer||"익명")}</b><small>${dateShort(c.created_at)}</small><p>${esc(c.body)}</p>${isAdmin?`<button class="btn" onclick="deleteComment('${c.id}')">삭제</button>`:""}</div>`).join(""):"<div class='empty'>등록된 댓글이 없습니다.</div>");}
function goList(){currentPost=null;render();}
function requireAdmin(){if(!isAdmin){$("loginModal").style.display="flex";$("passwordInput").focus();return false;}return true;}
function showEditor(title,fields,saveLabel,saveFn){let html=`<div class="editor"><h3>${title}</h3>${fields}<div style="display:flex;gap:7px;justify-content:flex-end"><button class="btn" onclick="render()">취소</button><button class="btn primary" id="editorSave">${saveLabel}</button></div></div>`;if(currentPost){$("detailView").insertAdjacentHTML("beforeend",html)}else{$("listView").insertAdjacentHTML("beforeend",html)}$("editorSave").onclick=saveFn;}
function editPost(id=null){if(!requireAdmin())return;let p=id?posts.find(x=>x.id===id):{title:"",body:"",writer:"관리자",is_notice:false,is_best:false};showEditor(id?"게시글 수정":"새 게시글 작성",`<div class="field"><label>제목</label><input id="eTitle" value="${esc(p.title)}"></div><div class="field"><label>작성자</label><input id="eWriter" value="${esc(p.writer)}"></div><div class="field"><label>본문</label><textarea id="eBody">${esc(p.body)}</textarea></div><label><input type="checkbox" id="eNotice" ${p.is_notice?"checked":""}> 공지글</label>　<label><input type="checkbox" id="eBest" ${p.is_best?"checked":""}> 개념글</label>`, "저장",async()=>{let data={id,title:$("eTitle").value,writer:$("eWriter").value,body:$("eBody").value,is_notice:$("eNotice").checked,is_best:$("eBest").checked};if(!data.title.trim())return toast("제목을 입력해 주세요.");try{await publicApi("save_post",{password:sessionStorage.getItem("adminPassword"),post:data});await loadAll();currentPost=id?posts.find(x=>x.id===id):null;render();}catch(e){toast("저장 실패: "+e.message)}});}
async function deletePost(id){if(!requireAdmin()||!confirm("이 게시글을 삭제할까요?"))return;try{await publicApi("delete_post",{password:sessionStorage.getItem("adminPassword"),id});currentPost=null;await loadAll()}catch(e){toast("삭제 실패: "+e.message)}}
async function likePost(id){try{await publicApi("like_post",{id});await loadAll();currentPost=posts.find(p=>p.id===id);renderDetail()}catch(e){toast("추천 처리에 실패했습니다.")}}
async function saveComment(){if(!requireAdmin())return;let body=$("commentBody").value.trim();if(!body)return;try{await publicApi("save_comment",{password:sessionStorage.getItem("adminPassword"),comment:{post_id:currentPost.id,writer:$("commentWriter").value||"관리자",body}});$("commentBody").value="";loadComments(currentPost.id)}catch(e){toast("댓글 등록 실패: "+e.message)}}

async function deleteComment(id){if(!requireAdmin())return;try{await publicApi("delete_comment",{password:sessionStorage.getItem("adminPassword"),id});loadComments(currentPost.id)}catch(e){toast("삭제 실패: "+e.message)}}
function editGallery(){if(!requireAdmin())return;showEditor("갤러리 설정",`<div class="field"><label>갤러리 이름</label><input id="gName" value="${esc(settings.name)}"></div><div class="field"><label>갤러리 설명</label><input id="gDesc" value="${esc(settings.description)}"></div>`,"저장",async()=>{try{await publicApi("save_settings",{password:sessionStorage.getItem("adminPassword"),settings:{name:$("gName").value,description:$("gDesc").value}});await loadAll()}catch(e){toast("저장 실패: "+e.message)}})}
$("adminLoginBtn").onclick=()=>{$("loginModal").style.display="flex";$("passwordInput").focus()};$("adminLogoutBtn").onclick=()=>{isAdmin=false;sessionStorage.removeItem("adminPassword");render()};
$("galleryEditBtn").onclick=editGallery;$("writeBtn").onclick=()=>editPost();
$("cancelLogin").onclick=()=>$("loginModal").style.display="none";
$("confirmLogin").onclick=async()=>{let pw=$("passwordInput").value;try{let r=await publicApi("verify_password",{password:pw});if(!r.ok)throw Error("비밀번호가 올바르지 않습니다.");isAdmin=true;sessionStorage.setItem("adminPassword",pw);$("loginModal").style.display="none";$("passwordInput").value="";render()}catch(e){$("loginError").textContent="비밀번호를 확인해 주세요.";}}
$("passwordInput").addEventListener("keydown",e=>{if(e.key==="Enter")$("confirmLogin").click()});
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));b.classList.add("active");currentTab=b.dataset.tab;currentPage=1;currentPost=null;render()});
function doSearch(){searchState={q:$("searchQuery").value||$("globalQuery").value,type:$("searchType").value};currentPage=1;currentPost=null;render();}
$("searchBtn").onclick=doSearch;$("topSearch").onsubmit=e=>{e.preventDefault();$("searchQuery").value=$("globalQuery").value;doSearch()};
async function init(){if(sbReady){await loadAll()}else{render();$("galleryDesc").textContent="설정 파일에 Supabase 연결 정보를 입력하면 게시글 저장이 활성화됩니다."}}
init();
</script>
</body></html>
